# Omarchy lab settings. Sourced by ./lab; every value can be overridden by an
# environment variable of the same name.

# --- guest identity ---------------------------------------------------------
: "${LAB_HOSTNAME:=omarchy-lab}"
# Default: this host's username, so $HOME-relative config paths match on both
# sides and `sync`/`promote` need no path rewriting.
: "${LAB_USER:=$(id -un)}"
: "${LAB_KEYBOARD:=us}"
: "${LAB_TIMEZONE:=}"              # empty -> copy the host timezone at bootstrap

# --- virtual hardware -------------------------------------------------------
: "${LAB_CPUS:=6}"
: "${LAB_MEMORY:=8G}"
: "${LAB_DISK_SIZE:=60G}"
: "${LAB_SSH_PORT:=2222}"          # qemu hostfwd port on the CONTAINER's loopback; never published

# --- exposure ---------------------------------------------------------------
# isolated: the VM container gets no network namespace beyond loopback, so the
#           guest can reach nothing — not the host, not the LAN, not the
#           internet — and nothing is published on the host. ssh rides a
#           `docker exec` into the container. Measured before this default
#           existed: an unrestricted guest reached the host's own sshd and
#           syncthing over the docker bridge, the LAN, and the internet.
#           Nothing the lab does by default needs the network — the install is
#           offline from the ISO.
# internet: docker's NAT bridge, for `pacman`/`omarchy update` experiments.
#           This re-exposes host services bound on 0.0.0.0 and the LAN to the
#           guest; use it only with a guest you trust.
: "${LAB_NET:=isolated}"
# VNC console for a human. Empty = not started. Needs LAB_NET=internet (there
# is no namespace to publish from otherwise). QEMU's VNC has no password here:
# any local account on the host can drive the autologged-in guest while it is
# on.
: "${LAB_VNC_PORT:=}"

# --- install media ----------------------------------------------------------
# Default: the Omarchy release this host runs, so the guest mirrors production.
# Falls back to the newest release known to this file when `omarchy` is absent
# (e.g. driving the lab from a non-Omarchy machine).
: "${LAB_OMARCHY_VERSION:=$(omarchy version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)}"
: "${LAB_OMARCHY_VERSION:=4.0.2}"
: "${LAB_ISO_URL:=https://iso.omarchy.org/omarchy-${LAB_OMARCHY_VERSION}.iso}"

# --- runner -----------------------------------------------------------------
: "${LAB_RUNNER_IMAGE:=omarchy-lab-runner:latest}"
: "${LAB_CONTAINER:=omarchy-lab}"

# Minutes to wait for the unattended install to finish and sshd to answer.
: "${LAB_INSTALL_TIMEOUT_MIN:=60}"
